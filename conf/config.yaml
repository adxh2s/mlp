defaults:
  - orchestrators/config@orchestrators.config: config
  - orchestrators/message@orchestrators.message: message
  - orchestrators/logger@orchestrators.logger: logger
  - orchestrators/file@orchestrators.file: file
  - orchestrators/data@orchestrators.data: data
  - orchestrators/eda@orchestrators.eda: eda
  - orchestrators/pipeline@orchestrators.pipeline: pipeline
  - orchestrators/report@orchestrators.report: report
  - _self_
  
project:
  name: mlp
  random_state: 42
  output_dir: outputs
  allow_example_fallback: false

mlflow:
  enabled: true
  experiment: mlp-experiments
