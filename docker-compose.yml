services:
  app:
    build: .
    container_name: mlp_app
    environment:
      - PATH=/opt/venv/bin:/root/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - MLP_OUTPUTS_DIR=/app/outputs
      - MLP_PROJECT_NAME=nba_project
      - MLP_NOTEBOOKS_DIR=/app/notebooks
      - MLP_NOTEBOOKS_URL=http://localhost:8866
      - MLP_LANG=fr
      - MLP_DOCS_DIR=/app/docs
      - STREAMLIT_SERVER_ENABLE_STATIC_SERVING=true  # sert app/static/...
    volumes:
      - outputs:/app/outputs
      - notebooks:/app/notebooks
      - ./data:/app/data:ro                  # dev -> a retirer en prod si inutile
      - ./docs:/app/docs:ro                  # dev -> a retirer en prod si inutile
      - ./docs:/app/static/docs:ro           # dev -> a retirer en prod si inutile
    ports:
      - "8501:8501"
    command:
      - /opt/venv/bin/python
      - -m
      - streamlit
      - run
      - streamlit_app.py
      - --server.address=0.0.0.0
      - --server.port=8501
    restart: unless-stopped

  notebooks:
    build: .
    container_name: mlp_notebooks
    working_dir: /app
    environment:
      - PATH=/opt/venv/bin:/root/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - outputs:/app/outputs
      - notebooks:/app/notebooks
      - ./data:/app/data:ro                  # dev -> a retirer en prod si inutile
      - ./docs:/app/docs:ro                  # dev -> a retirer en prod si inutile
    ports:
      - "8888:8888"
    command:
      - /opt/venv/bin/python
      - -m
      - jupyter
      - lab
      - --ip=0.0.0.0
      - --port=8888
      - --no-browser
      - --allow-root
      - --NotebookApp.token=
    restart: unless-stopped

  voila:
    build: .
    container_name: mlp_voila
    working_dir: /app
    environment:
      - PATH=/opt/venv/bin:/root/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - outputs:/app/outputs
      - notebooks:/app/notebooks
      - ./data:/app/data:ro                  # dev -> a retirer en prod si inutile
      - ./docs:/app/docs:ro                  # dev -> a retirer en prod si inutile
    ports:
      - "8866:8866"
    command:
      - /opt/venv/bin/python
      - -m
      - voila
      - --Voila.ip=0.0.0.0
      - --port=8866
      - --no-browser
      - --Voila.root_dir=/app
    restart: unless-stopped

volumes:
  outputs:
  notebooks:
