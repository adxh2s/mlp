services:
  app:
    build:
      context: .
      args:
        UID: ${UID:-1001}
        GID: ${GID:-1001}
        USER: ${USER:-adxh2s}
    container_name: mlp_app
    user: "${UID:-1001}:${GID:-1001}"
    environment:
      - PATH=/opt/venv/bin:/home/${USER:-adxh2s}/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - HOME=/home/${USER:-adxh2s}
      - MLP_OUTPUTS_DIR=/app/outputs
      - MLP_PROJECT_NAME=nba_project
      - MLP_NOTEBOOKS_DIR=/app/notebooks
      - MLP_NOTEBOOKS_URL=http://localhost:8866
      - MLP_LANG=fr
      - MLP_DOCS_DIR=/app/docs
      - STREAMLIT_SERVER_ENABLE_STATIC_SERVING=true
      - MLP_LOG_FILE=/logs/streamlit/mlp.json
    volumes:
      - outputs:/app/outputs
      - notebooks:/app/notebooks
      - ./data:/app/data:ro
      - ./docs:/app/docs:ro
      - ./docs:/app/static/docs:ro
      - ./logs:/logs:rw
      # Nouveau: montages nécessaires pour AppOrchestrator + i18n
      - ./conf:/app/conf:ro
      - ./src:/app/src:ro
      - ./i18n:/app/i18n:ro
    ports:
      - "8501:8501"
    command:
      - /opt/venv/bin/python
      - -m
      - streamlit
      - run
      - streamlit_app.py
      - --server.address=0.0.0.0
      - --server.port=8501
    restart: unless-stopped

  notebooks:
    build:
      context: .
      args:
        UID: ${UID:-1001}
        GID: ${GID:-1001}
        USER: ${USER:-adxh2s}
    container_name: mlp_notebooks
    user: "${UID:-1001}:${GID:-1001}"
    working_dir: /app
    environment:
      - PATH=/opt/venv/bin:/home/${USER:-adxh2s}/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - outputs:/app/outputs
      - notebooks:/app/notebooks
      - ./data:/app/data:ro
      - ./docs:/app/docs:ro
      # Nouveaux montages (pour réutiliser conf/src/i18n en notebooks si besoin)
      - ./conf:/app/conf:ro
      - ./src:/app/src:ro
      - ./i18n:/app/i18n:ro
    ports:
      - "8888:8888"
    command:
      - /opt/venv/bin/python
      - -m
      - jupyter
      - lab
      - --ip=0.0.0.0
      - --port=8888
      - --no-browser
      - --allow-root
      - --NotebookApp.token=
    restart: unless-stopped

  voila:
    build:
      context: .
      args:
        UID: ${UID:-1001}
        GID: ${GID:-1001}
        USER: ${USER:-adxh2s}
    container_name: mlp_voila
    user: "${UID:-1001}:${GID:-1001}"
    working_dir: /app
    environment:
      - PATH=/opt/venv/bin:/home/${USER:-adxh2s}/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - outputs:/app/outputs
      - notebooks:/app/notebooks
      - ./data:/app/data:ro
      - ./docs:/app/docs:ro
      # Nouveaux montages pour cohérence
      - ./conf:/app/conf:ro
      - ./src:/app/src:ro
      - ./i18n:/app/i18n:ro
    ports:
      - "8866:8866"
    command:
      - /opt/venv/bin/python
      - -m
      - voila
      - --Voila.ip=0.0.0.0
      - --port=8866
      - --no-browser
      - --Voila.root_dir=/app
    restart: unless-stopped

volumes:
  outputs:
  notebooks:
