[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlp"
version = "0.1.0"
description = "ML phases: EDA → Pipelines → Reports with Hydra/Pydantic/Jinja/Streamlit"
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [{ name = "mlp-team" }]
license = { text = "MIT" }

dependencies = [
  "pyyaml>=6.0.1",
  "hydra-core>=1.3.2",
  "omegaconf>=2.3.0",
  "pydantic>=2.5,<3",
  "pandas>=2.2,<2.3",
  "numpy==1.25.2",
  "scipy==1.11.4",
  "scikit-learn==1.3.2",
  "imbalanced-learn>=0.12,<0.13",
  "ydata-profiling>=4.6,<4.7",
  "umap-learn>=0.5.5,<0.6",
  "tpot>=0.12,<0.13",
  "matplotlib>=3.8,<3.9",
  "jinja2>=3.1,<4",
  "streamlit>=1.36,<1.38",
  "lazypredict>=0.2.16,<0.3",
  "plotly>=5.22,<6",
  "structlog>=24.1,<25",
  "mlflow>=2.12,<3",
  "jupyterlab>=4,<5",
  "ipykernel>=6,<7",
  "nbconvert>=7,<8",
  "nbformat>=5,<6",
  "protobuf==4.25.3",
  "tensorflow==2.16.1",
  "setuptools>=80.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "mypy>=1.17",
  "ruff>=0.12",
  "pre-commit>=3.7",
  "types-PyYAML",
]

[tool.ruff]
line-length = 100
target-version = "py311"
lint.select = ["E", "F", "I", "B", "UP", "N", "S", "PL", "C90"]
lint.ignore = ["E501"]
extend-exclude = ["outputs", ".venv", ".git", "build", "dist"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
strict_equality = true
exclude = "(outputs|.venv|build|dist|.git)/"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
override-dependencies = [
  "numpy==1.25.2",
  "protobuf==4.25.3",
  "tensorflow==2.16.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["tests*"]

